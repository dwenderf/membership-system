name: Check databases are up to date

# Answers "did anyone actually apply that migration?" without having to
# remember. Compares the migration files in this repo against what each database
# reports in supabase_migrations.schema_migrations, and fails when a database is
# behind.
#
# Merging a PR that touches supabase/migrations/ starts db-migrate.yml, but that
# workflow runs after the push has landed and, for production, waits on a human
# to approve the `supabase-production` Environment -- so a merge alone still
# does not apply anything. A migration can sit unapplied indefinitely with
# every other signal green. This is the check that notices.
#
# Read-only: it selects from the migration history table and nothing else.
#
# Credentials (#290 Part 0/1): this workflow does NOT use the admin
# SUPABASE_DB_URL that db-migrate.yml uses. That secret lives in the
# `supabase-production` Environment, which carries a required reviewer -- right
# for a workflow that writes to production, wrong for a read-only status check
# that has no decision for a reviewer to make. Gating it meant the scheduled
# run queued as `waiting` and never executed, so a genuinely-behind production
# database produced the same silence as everything being fine.
#
# The fix is not to copy the admin connection string into an ungated
# Environment -- that would duplicate a credential the reviewer gate exists to
# protect. Instead, production reads through `ci_readonly`, a role that can
# only SELECT supabase_migrations.schema_migrations (see the
# ci_readonly_role migration), via SUPABASE_DB_URL_READONLY in the ungated
# `supabase-production-readonly` Environment. A leaked credential there
# exposes a list of migration version numbers and nothing else.
#
# `supabase-development` is unaffected -- that Environment has no required
# reviewer, so it keeps using the same SUPABASE_DB_URL as db-migrate.yml.
#
# See README "Database Migrations" for how to set up the readonly role and
# Environment on a project that doesn't have them yet. Until
# SUPABASE_DB_URL_READONLY (or, for development, SUPABASE_DB_URL) is
# configured, the run reports "not configured" and passes, rather than
# failing every morning about setup that hasn't happened yet.
#
# The comparison itself lives in scripts/ci/check-db-drift.sh, shared with
# db-migration-preflight.yml -- that one runs the identical check as a
# required PR check instead of a schedule, so a merge can't land ahead of a
# migration that was never applied in the first place.

on:
  schedule:
    # 13:00 UTC on weekdays — morning in US Eastern, after any overnight work.
    - cron: '0 13 * * 1-5'
  workflow_dispatch:
    inputs:
      target:
        description: 'Which database to check'
        required: true
        type: choice
        options:
          - supabase-production
          - supabase-development

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # supabase-development has no required reviewer, so it can keep using the
    # same Environment (and SUPABASE_DB_URL) as db-migrate.yml. Production
    # reads through the ungated, read-only supabase-production-readonly
    # Environment instead of the gated admin one -- see the header comment.
    environment: >-
      ${{ inputs.target == 'supabase-development' && 'supabase-development' || 'supabase-production-readonly' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Compare migration files against the database
      env:
        SUPABASE_DB_URL: >-
          ${{ inputs.target == 'supabase-development' && secrets.SUPABASE_DB_URL || secrets.SUPABASE_DB_URL_READONLY }}
        TARGET: ${{ inputs.target || 'supabase-production' }}
      run: bash scripts/ci/check-db-drift.sh

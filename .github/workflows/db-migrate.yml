name: Apply database migrations

# Applies pending migrations from supabase/migrations/ to one of the Supabase
# projects, using the Supabase CLI's own migration tracking.
#
# Runs on merge (when migration files changed) and on demand.
#
# WHAT A FAILURE HERE MEANS: this workflow runs after the push has already
# landed, so it cannot fail the merge or undo it. A red run means the commit is
# on the branch and the migration is NOT applied -- the database is behind the
# code. Nothing is rolled back.
#
# The guards that can actually stop a bad migration before it merges are the PR
# checks: schema:check, migrations:lint, and the `schema` job that applies
# schema.sql to a real PostgreSQL service container. Those run on the pull
# request, where failing them blocks the merge.
#
# Whether a migration has actually been *applied* yet is a separate question
# from whether it's *safe*, and db-migration-preflight.yml guards that (#290):
# a required PR check that fails the pull request itself if the target
# database is missing a migration this repo carries -- so merging is blocked
# until someone runs this workflow, not just until someone approves it after
# the fact. Detecting drift from anywhere else (SQL applied by hand outside
# the repo entirely) is a separate, harder problem, tracked in #312.
#
# SETUP — see README "Automating migrations" before the first run:
#   1. Seed the CLI's migration history on both projects, once. The baseline was
#      applied by hand, and the CLI does not know that yet:
#        supabase migration repair --status applied 20260907000000 20260907000001
#   2. Create GitHub Environments named `supabase-development` and
#      `supabase-production` (Settings → Environments).
#
#      Deliberately NOT the existing `Production`/`Preview` environments: those
#      belong to the Vercel integration, and adding a reviewer to them would
#      gate Vercel deployments as well as migrations.
#
#      A required reviewer on `supabase-production` is optional, not load-bearing
#      -- db-migration-preflight.yml is what actually stops an unapplied
#      migration from merging. Adding one here layers a second, human checkpoint
#      *after* merge, at the cost of this job sitting at `waiting` until someone
#      clicks Approve, silently, with no failure to notice if they don't (this is
#      exactly what happened before #290: the scheduled drift check this repo
#      used to run inherited the same gate and queued unnoticed for hours).
#      Weigh that before turning it on.
#   3. Add a SUPABASE_DB_URL secret to each Environment, set to that project's
#      Postgres connection string -- NOT the https://<ref>.supabase.co API URL.
#      Dashboard -> Connect -> Session pooler (port 5432), which is session mode
#      and IPv4-reachable. Not the transaction pooler (6543): transaction mode
#      breaks migrations. The direct connection is session mode too, but is
#      IPv6-only without the IPv4 add-on, and GitHub runners are IPv4.
#
# The development database is usually already current, because migrations are
# applied there during feature work so preview deployments can exercise them.
# For production, the expected flow is: apply manually (workflow_dispatch,
# below) before merging the PR, so the preflight check passes; the push
# trigger then re-runs after merge and no-ops, since everything is already
# applied. It only does real work if something bypassed the preflight check.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which database to apply to'
        required: true
        type: choice
        options:
          - supabase-development
          - supabase-production
      dry_run:
        description: 'Only show what would be applied (recommended first)'
        type: boolean
        default: true

  # Applies automatically when a push changes a migration file. A merge to
  # development applies unattended, which is the point: previews run against
  # that database. A merge to main runs too, but by the time it lands the
  # preflight check should already have forced a manual apply -- see the
  # header comment -- so this is a no-op unless that was bypassed, or (if a
  # required reviewer is configured on `supabase-production`) it waits for
  # that approval first.
  #
  # The paths filter matters: pushes that don't touch supabase/migrations/ don't
  # trigger anything.
  #
  # This runs AFTER the push has landed. It cannot block or roll back a merge --
  # see the note on failure below.
  push:
    branches: [main, development]
    paths: ['supabase/migrations/**']

permissions:
  contents: read

# One apply per database at a time. cancel-in-progress is deliberately false:
# interrupting a run that is partway through `db push` is how you get a database
# in a state no migration file describes.
concurrency:
  group: >-
    db-migrate-${{ inputs.target
                   || (github.ref_name == 'main' && 'supabase-production')
                   || 'supabase-development' }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest

    # Selects which Environment's SUPABASE_DB_URL is used, and enforces that
    # Environment's protection rules, if any are configured -- see the header
    # comment on why a required reviewer here is optional rather than the
    # thing actually keeping an unapplied migration from merging.
    # Manual runs use the chosen target. A push maps branch to database --
    # without this, a push to main would fall back to 'supabase-development'
    # and quietly apply nothing to prod.
    environment: >-
      ${{ inputs.target
          || (github.ref_name == 'main' && 'supabase-production')
          || 'supabase-development' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Supabase CLI
      uses: supabase/setup-cli@v1
      with:
        version: latest

    - name: Verify the connection string is configured
      env:
        SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        TARGET: >-
          ${{ inputs.target
              || (github.ref_name == 'main' && 'supabase-production')
              || 'supabase-development' }}
      run: |
        if [ -z "$SUPABASE_DB_URL" ]; then
          echo "::error::SUPABASE_DB_URL is not set for the '$TARGET' environment. See README 'Automating migrations'."
          exit 1
        fi

        trimmed="$(printf '%s' "$SUPABASE_DB_URL" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
        if [ "$trimmed" != "$SUPABASE_DB_URL" ]; then
          echo "::error::SUPABASE_DB_URL for '$TARGET' has leading or trailing whitespace. GitHub's secret field preserves it invisibly -- re-save the secret without it."
          exit 1
        fi

        case "$SUPABASE_DB_URL" in
          postgresql://*|postgres://*) ;;
          *)
            echo "::error::SUPABASE_DB_URL for '$TARGET' does not start with postgresql:// or postgres:// -- psql will treat it as a plain database name and try the local Unix socket instead of connecting to Supabase. Check for a copied 'psql ' prefix or surrounding quotes."
            exit 1
            ;;
        esac

        # Neither the username nor the host is secret; the project ref is already in AGENTS.md.
        echo "user/host: $(printf '%s' "$SUPABASE_DB_URL" | sed -E 's#^[a-z]+://([^:]+):[^@]*@#\1@#')"

    - name: Show migration status
      env:
        SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      run: supabase migration list --db-url "$SUPABASE_DB_URL"

    - name: Apply pending migrations
      # A push carries no inputs, so dry_run is empty: apply. A manual run
      # applies only when the box was unchecked.
      if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
      env:
        SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      run: supabase db push --db-url "$SUPABASE_DB_URL"

    - name: Show migration status after applying
      if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
      env:
        SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      run: supabase migration list --db-url "$SUPABASE_DB_URL"

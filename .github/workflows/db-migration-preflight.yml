name: Migration applied to target database

# Required PR check (#290): fails a pull request if supabase/migrations/
# carries anything not yet applied to the database its base branch deploys
# to. The point is to force the *Apply database migrations* workflow to run
# *before* merge, on the contributor's own schedule -- rather than relying
# on db-migrate.yml's post-merge auto-apply, which for development is
# unattended (fine) and for production is either gated behind a required
# reviewer who might not click Approve for hours, or (if that gate is off)
# applies immediately and unattended with nothing left to catch a mistake
# before it lands.
#
# This runs on every PR into main or development, not just ones that touch
# supabase/migrations/ -- a required check has to report on every PR or it
# blocks merges forever waiting for a run that never happens (see README
# "Two things about the status checks", same reasoning as the `schema`
# check). The job itself is a couple of lightweight SQL queries, so running
# it unconditionally costs little.
#
# Read-only: SUPABASE_DB_URL_READONLY (via the ci_readonly role) for
# production, the existing SUPABASE_DB_URL for development. See README
# "Database Migrations" for how those are set up. Until they exist this
# reports "not configured" and passes, rather than blocking every PR on
# setup that hasn't happened yet.
#
# Once this has run at least once, add it to the branch ruleset's required
# status checks alongside `test` and `schema` -- see README "Two things
# about the status checks specifically" for why it has to be added from the
# picker rather than typed by hand.

on:
  pull_request:
    branches: [main, development]

permissions:
  contents: read

jobs:
  check:
    # Required status checks match on the check-run name, which defaults to
    # the job id ("check") without this -- not the workflow-level `name:`
    # above, which only labels the run in the Actions UI. Without it, the
    # ruleset's required-checks picker would never see "Migration applied to
    # target database" to add.
    name: Migration applied to target database
    runs-on: ubuntu-latest
    # PRs into development check against supabase-development (ungated,
    # same credential db-migrate.yml uses there). PRs into main check
    # production through the read-only, ungated environment -- never the
    # gated admin one, so this check can run on every PR without waiting on
    # anyone.
    environment: >-
      ${{ github.base_ref == 'development' && 'supabase-development' || 'supabase-production-readonly' }}

    steps:
    - name: Checkout PR head
      uses: actions/checkout@v4

    - name: Compare this PR's migrations against the target database
      env:
        SUPABASE_DB_URL: >-
          ${{ github.base_ref == 'development' && secrets.SUPABASE_DB_URL || secrets.SUPABASE_DB_URL_READONLY }}
        TARGET: ${{ github.base_ref == 'development' && 'supabase-development' || 'supabase-production' }}
      run: |
        set -euo pipefail

        if [ -z "${SUPABASE_DB_URL:-}" ]; then
          echo "::warning::SUPABASE_DB_URL is not configured for '$TARGET'; skipping. See README 'Database Migrations'."
          echo "### Preflight check skipped — \`$TARGET\` has no SUPABASE_DB_URL secret" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        trimmed="$(printf '%s' "$SUPABASE_DB_URL" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
        if [ "$trimmed" != "$SUPABASE_DB_URL" ]; then
          echo "::error::SUPABASE_DB_URL for '$TARGET' has leading or trailing whitespace. GitHub's secret field preserves it invisibly -- re-save the secret without it."
          exit 1
        fi

        case "$SUPABASE_DB_URL" in
          postgresql://*|postgres://*) ;;
          *)
            echo "::error::SUPABASE_DB_URL for '$TARGET' does not start with postgresql:// or postgres:// -- psql will treat it as a plain database name and try the local Unix socket instead of connecting to Supabase. Check for a copied 'psql ' prefix or surrounding quotes."
            exit 1
            ;;
        esac

        # Neither the username nor the host is secret; the project ref is already in AGENTS.md.
        echo "user/host: $(printf '%s' "$SUPABASE_DB_URL" | sed -E 's#^[a-z]+://([^:]+):[^@]*@#\1@#')"

        psql --version >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y postgresql-client; }

        # Versions this PR's checkout carries, from the filename prefix.
        ls supabase/migrations/*.sql \
          | xargs -n1 basename \
          | sed 's/_.*//' \
          | sort > /tmp/repo_versions

        # Versions the database says it has applied.
        psql "$SUPABASE_DB_URL" -tAc \
          "select version from supabase_migrations.schema_migrations order by version" \
          | sed '/^$/d' | sort > /tmp/db_versions

        unapplied=$(comm -23 /tmp/repo_versions /tmp/db_versions)

        {
          echo "## Migration status — \`$TARGET\`"
          echo
          echo "- migration files in this PR: $(wc -l < /tmp/repo_versions)"
          echo "- applied in database:        $(wc -l < /tmp/db_versions)"
        } >> "$GITHUB_STEP_SUMMARY"

        if [ -n "$unapplied" ]; then
          {
            echo
            echo "### Not yet applied to \`$TARGET\`"
            echo '```'
            echo "$unapplied"
            echo '```'
            echo "Run the *Apply database migrations* workflow (target: $TARGET), then re-run this check."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::$TARGET is missing migrations this PR carries: $(echo $unapplied | tr '\n' ' ')"
          exit 1
        fi

        echo "### ✅ \`$TARGET\` already has every migration in this PR" >> "$GITHUB_STEP_SUMMARY"

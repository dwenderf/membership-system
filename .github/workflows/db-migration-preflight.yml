name: Migration applied to target database

# Required PR check (#290): fails a pull request if supabase/migrations/
# carries anything not yet applied to the database its base branch deploys
# to. The point is to force the *Apply database migrations* workflow to run
# *before* merge, on the contributor's own schedule -- rather than relying
# on db-migrate.yml's post-merge auto-apply, which for development is
# unattended (fine) and for production is either gated behind a required
# reviewer who might not click Approve for hours, or (if that gate is off)
# applies immediately and unattended with nothing left to catch a mistake
# before it lands.
#
# This runs on every PR into main or development, not just ones that touch
# supabase/migrations/ -- a required check has to report on every PR or it
# blocks merges forever waiting for a run that never happens (see README
# "Two things about the status checks", same reasoning as the `schema`
# check). The job itself is a couple of lightweight SQL queries, so running
# it unconditionally costs little.
#
# Read-only: shares scripts/ci/check-db-drift.sh with db-drift-check.yml,
# and the same credentials -- SUPABASE_DB_URL_READONLY (via ci_readonly) for
# production, the existing SUPABASE_DB_URL for development. See that
# workflow's header and README "Database Migrations" for how those are set
# up. Until they exist this reports "not configured" and passes rather than
# blocking every PR on setup that hasn't happened yet.
#
# Once this has run at least once, add it to the branch ruleset's required
# status checks alongside `test` and `schema` -- see README "Two things
# about the status checks specifically" for why it has to be added from the
# picker rather than typed by hand.

on:
  pull_request:
    branches: [main, development]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # PRs into development check against supabase-development (ungated,
    # same credential db-migrate.yml uses there). PRs into main check
    # production through the read-only, ungated environment -- never the
    # gated admin one, so this check can run on every PR without waiting on
    # anyone.
    environment: >-
      ${{ github.base_ref == 'development' && 'supabase-development' || 'supabase-production-readonly' }}

    steps:
    - name: Checkout PR head
      uses: actions/checkout@v4

    - name: Compare this PR's migrations against the target database
      env:
        SUPABASE_DB_URL: >-
          ${{ github.base_ref == 'development' && secrets.SUPABASE_DB_URL || secrets.SUPABASE_DB_URL_READONLY }}
        TARGET: ${{ github.base_ref == 'development' && 'supabase-development' || 'supabase-production' }}
      run: bash scripts/ci/check-db-drift.sh

name: Run Tests
permissions:
  contents: read

on:
  pull_request:
    branches: [ main, development ]
  push:
    branches: [ main, development ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --ignore-scripts

    - name: Run tests
      run: npm test -- --passWithNoTests

    - name: Run lint
      run: npm run lint

    - name: Check generated schema.sql is up to date
      run: npm run schema:check

    - name: Lint migrations for unsafe views and grants
      run: npm run migrations:lint

    - name: Check the magic-link email template is still valid
      run: npm run auth:verify

    - name: Run typecheck
      run: npm run typecheck

    - name: Run build
      run: npm run build
      env:
        NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
        NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder_anon_key
        SUPABASE_SERVICE_ROLE_KEY: placeholder_service_role_key
        STRIPE_SECRET_KEY: sk_test_placeholder
        STRIPE_API_VERSION: "2025-01-01"
        STRIPE_WEBHOOK_SECRET: whsec_placeholder
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
        XERO_CLIENT_ID: placeholder_xero_client_id
        XERO_CLIENT_SECRET: placeholder_xero_client_secret
        XERO_REDIRECT_URI: https://placeholder.example.com/xero/callback
        XERO_SCOPES: placeholder_scopes
        ADMIN_SECRET: placeholder_admin_secret
        CRON_SECRET: placeholder_cron_secret
        NEXT_PUBLIC_SITE_URL: https://placeholder.example.com
        NEXT_PUBLIC_APP_TIMEZONE: America/New_York

    - name: Upload coverage reports (optional)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/
        if-no-files-found: ignore

  schema:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Ensure psql is available
      run: psql --version || sudo apt-get update && sudo apt-get install -y postgresql-client

    - name: Apply supabase/schema.sql to a throwaway database
      run: bash scripts/verify-schema-applies.sh
      env:
        PGHOST: localhost
        PGPORT: 5432
        PGUSER: postgres
        PGPASSWORD: postgres
